<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: Inter, "Noto Color Emoji", sans-serif; color: #fff; position: relative; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 85% 5%, rgba(57,231,95,.20), transparent 60%),
      radial-gradient(900px 900px at 0% 100%, rgba(57,231,95,.14), transparent 60%),
      linear-gradient(180deg, #000, #050a06); }
  .grid { position: absolute; inset: 0; opacity: .07;
      background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
      background-size: 60px 60px; }
  .mark { position: absolute; right: 50px; bottom: 50px; width: 110px; height: 110px; background: url(assets/shield.png) center/contain no-repeat; opacity: .5; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  b { background: linear-gradient(180deg, #7dff8f, #1fc94a); -webkit-background-clip: text; color: transparent; }
  .silver { background: linear-gradient(180deg, #ffffff, #9aa3a0); -webkit-background-clip: text; color: transparent; }

  /* text scenes */
  .tx { position: absolute; left: 80px; right: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 34px; }
  .kicker { font-size: 34px; font-weight: 800; letter-spacing: 6px; color: #39e75f; border: 3px solid #39e75f; padding: 14px 30px; border-radius: 60px; }
  .line { font-weight: 900; font-size: 92px; line-height: 1.06; letter-spacing: -2px; }
  .line.md { font-size: 70px; font-weight: 800; letter-spacing: -1px; }
  .sub { font-size: 40px; color: #aeb6b2; font-weight: 600; line-height: 1.3; font-style: italic; }
  .items { display: flex; flex-direction: column; gap: 22px; width: 100%; margin-top: 10px; }
  .item { display: flex; align-items: center; gap: 26px; text-align: left; background: rgba(255,255,255,.05); border: 2px solid rgba(154,163,160,.35); border-radius: 30px; padding: 28px 34px; font-size: 44px; font-weight: 700; line-height: 1.2; }
  .item .n { flex: none; width: 82px; height: 82px; border-radius: 50%; background: #39e75f; color: #000; font-weight: 900; font-size: 44px; display: flex; align-items: center; justify-content: center; }
  .item small { display: block; font-size: 30px; color: #9aa3a0; font-weight: 500; font-style: italic; margin-top: 6px; }

  /* chat scenes */
  .cap { position: absolute; left: 60px; right: 60px; top: 110px; height: 300px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .cap div { position: absolute; font-weight: 800; font-size: 66px; line-height: 1.12; letter-spacing: -1px; }
  .phone { position: absolute; left: 90px; width: 900px; top: 440px; height: 1180px; border-radius: 56px; background: #0e1621;
      box-shadow: 0 40px 140px rgba(57,231,95,.18), 0 0 0 10px #1a1d1b, 0 0 0 12px #9aa3a0; overflow: hidden; }
  .head { height: 128px; background: #17212b; display: flex; align-items: center; padding: 0 34px; gap: 22px; border-bottom: 1px solid #0b1118; }
  .back { font-size: 44px; color: #6ab3f3; }
  .ava { width: 78px; height: 78px; border-radius: 50%; background: #000 url(assets/shield.png) center/cover; }
  .hname { font-size: 34px; font-weight: 700; }
  .hsub { font-size: 26px; color: #7f91a4; margin-top: 4px; }
  .hsub.typing { color: #6ab3f3; }
  .chat { position: absolute; top: 128px; bottom: 112px; left: 0; right: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 26px 18px; overflow: hidden; }
  .wrap { overflow: hidden; flex: none; }
  .msg { padding-top: 14px; display: flex; }
  .msg.out { justify-content: flex-end; }
  .bubble { max-width: 780px; background: #182533; border-radius: 30px 30px 30px 8px; padding: 20px 26px 16px; font-size: 29px; line-height: 1.38; }
  .out .bubble { background: #2b5278; border-radius: 30px 30px 8px 30px; }
  .bubble strong { font-weight: 700; }
  .time { font-size: 21px; color: #8ea4b9; text-align: right; margin-top: 4px; }
  .out .time { color: #a7c6e6; }
  .file { display: flex; gap: 22px; align-items: center; min-width: 470px; }
  .ficon { width: 84px; height: 84px; border-radius: 50%; background: #4fa3e3; display: flex; align-items: center; justify-content: center; font-size: 38px; flex: none; }
  .fname { font-size: 29px; font-weight: 600; }
  .fsize { font-size: 24px; color: #a7c6e6; margin-top: 4px; }
  .flag { margin-top: 14px; }
  .flag .why { color: #c3d0dc; font-size: 26px; padding-left: 40px; }
  .kb { display: grid; gap: 8px; margin-top: 8px; max-width: 780px; }
  .btn { background: rgba(43, 82, 120, .55); border-radius: 18px; text-align: center; padding: 18px; font-size: 28px; font-weight: 600; }
  .compose { position: absolute; bottom: 0; left: 0; right: 0; height: 112px; background: #17212b; display: flex; align-items: center; padding: 0 34px; gap: 24px; color: #6c7883; font-size: 30px; }
  .compose .pill { flex: 1; }
  .tap { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.55); pointer-events: none; opacity: 0; }

  /* letter */
  .letter { position: absolute; left: 140px; width: 800px; top: 470px; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.7); background: #fff; }
  .letter img { width: 100%; display: block; }
  .hl { position: absolute; left: 7%; width: 0; background: rgba(57,231,95,.35); border-radius: 6px; mix-blend-mode: multiply; }

  /* end card */
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; padding: 0 80px; }
  .logo { width: 520px; height: 520px; background: url(assets/logo-a.png) center/contain no-repeat; filter: drop-shadow(0 0 50px rgba(57,231,95,.3)); }
  .tag { font-size: 44px; color: #d6dcd8; line-height: 1.3; font-weight: 600; }
  .price { font-size: 120px; font-weight: 900; color: #39e75f; letter-spacing: -3px; }
  .price span { font-size: 44px; color: #fff; font-weight: 700; letter-spacing: 0; }
  .cta { background: linear-gradient(180deg, #5cff78, #1fc94a); color: #000; font-weight: 900; font-size: 46px; padding: 30px 60px; border-radius: 80px; }
  .fine { font-size: 28px; color: #7f8a84; margin-top: 10px; }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div id="stage"></div>
<div class="mark" id="mark"></div>
<script>
// SPEC is injected by render.mjs: { duration, msgBox, typing, sub, scenes: [...] }
const S = window.SPEC;
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
const clamp = (x) => Math.max(0, Math.min(1, x));
const stage = document.getElementById("stage");
const el = (cls, html = "", parent = stage) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; parent.appendChild(d); return d; };
const anims = [];   // functions of t
const FADE = 0.35;

function sceneFade(sc, node) {
  anims.push((t) => {
    const a = ease((t - sc.t0) / FADE), b = sc.t1 == null ? 1 : clamp((sc.t1 - t) / FADE);
    node.style.opacity = Math.min(a, b);
  });
}
function pop(node, at, dy = 30) {
  anims.push((t) => { const p = ease((t - at) / 0.45); node.style.opacity = p; node.style.transform = `translateY(${(1 - p) * dy}px)`; });
}

const builders = {
  text(sc, node) {
    const tx = el("tx", "", node);
    let k = 0;
    if (sc.kicker) pop(el("kicker", sc.kicker, tx), sc.t0 + 0.05);
    sc.lines.forEach((l, i) => pop(el("line" + (sc.size === "md" ? " md" : ""), l, tx), sc.t0 + 0.1 + i * 0.25, 40));
    if (sc.sub) pop(el("sub", sc.sub, tx), sc.t0 + 0.4 + sc.lines.length * 0.25);
    if (sc.items) {
      const box = el("items", "", tx);
      sc.items.forEach((it) => pop(el("item", `<div class="n">${it.n}</div><div>${it.html}${it.sub ? `<small>${it.sub}</small>` : ""}</div>`, box), it.at, 40));
    }
  },
  chat(sc, node) {
    const cap = el("cap", "", node);
    const phone = el("phone", `<div class="head"><div class="back">‹</div><div class="ava"></div><div><div class="hname">Certified Builders</div><div class="hsub">${S.sub}</div></div></div><div class="chat"></div><div class="compose"><span>📎</span><span class="pill">${S.msgBox}</span><span>🎤</span></div><div class="tap"></div>`, node);
    const chat = phone.querySelector(".chat"), hsub = phone.querySelector(".hsub"), tap = phone.querySelector(".tap");
    const msgs = [];
    for (const m of sc.msgs) {
      const body = m.file ? `<div class="file"><div class="ficon">📄</div><div><div class="fname">${m.file[0]}</div><div class="fsize">${m.file[1]}</div></div></div>` : m.html;
      const kb = m.kb ? `<div class="kb">${m.kb.map((b) => `<div class="btn">${b}</div>`).join("")}</div>` : "";
      const w = el("wrap", `<div class="msg ${m.out ? "out" : ""}"><div><div class="bubble">${body}<div class="time">${m.clock || "9:42 PM"}${m.out ? " ✓✓" : ""}</div></div>${kb}</div></div>`, chat);
      msgs.push({ m, w, h: w.scrollHeight, inner: w.firstChild });
    }
    anims.push((t) => {
      const c = sc.caps.find(([a, b]) => t >= a && t < b);
      if (c) { const p = ease((t - c[0]) / 0.35), o = clamp((c[1] - t) / 0.25); cap.innerHTML = `<div style="opacity:${Math.min(p, o)};transform:translateY(${(1 - p) * 30}px)">${c[2]}</div>`; }
      else cap.innerHTML = "";
      for (const x of msgs) { const p = ease((t - x.m.at) / 0.45); x.w.style.height = `${p * x.h}px`; x.inner.style.opacity = p; x.inner.style.transform = `translateY(${(1 - p) * 30}px)`; }
      const typing = (sc.typing || []).some(([a, b]) => t > a && t < b);
      hsub.textContent = typing ? S.typing : S.sub; hsub.className = "hsub" + (typing ? " typing" : "");
      tap.style.opacity = 0;
      for (const x of msgs) {
        if (x.m.tapAt == null) continue;
        const btn = x.w.querySelectorAll(".btn")[x.m.tapIdx || 0];
        const tp = (t - x.m.tapAt) / 0.6;
        if (tp > 0 && tp < 1) {
          const r = btn.getBoundingClientRect(), ph = phone.getBoundingClientRect();
          tap.style.left = `${r.left - ph.left + r.width / 2 - 60}px`; tap.style.top = `${r.top - ph.top + r.height / 2 - 60}px`;
          tap.style.opacity = 1 - tp; tap.style.transform = `scale(${0.4 + tp * 1.2})`; btn.style.background = "rgba(106,179,243,.55)";
        } else btn.style.background = "";
      }
    });
  },
  letter(sc, node) {
    const cap = el("cap", `<div>${sc.cap}</div>`, node);
    const L = el("letter", `<img src="${sc.img}">`, node);
    const hls = sc.hl.map(([top, h, at]) => { const d = el("hl", "", L); d.style.top = `${top}%`; d.style.height = `${h}%`; return [d, at]; });
    anims.push((t) => {
      const p = ease((t - sc.t0) / 0.7);
      L.style.transform = `translateY(${(1 - p) * 500}px) scale(${0.92 + p * 0.08 + Math.max(0, t - sc.t0 - 0.7) * 0.012})`;
      for (const [d, at] of hls) d.style.width = `${86 * ease((t - at) / 0.5)}%`;
    });
  },
  end(sc, node) {
    const end = el("end", `<div class="logo"></div><div class="tag">${sc.tag}</div><div class="price">$50 <span>${sc.per}</span></div><div class="cta">${sc.cta}</div><div class="fine">${sc.fine}</div>`, node);
    [...end.children].forEach((c, i) => pop(c, sc.t0 + i * 0.15));
    const cta = end.querySelector(".cta");
    anims.push((t) => { const q = ease((t - sc.t0 - 0.45) / 0.45), pulse = t > sc.t0 + 1.4 ? 1 + Math.max(0, Math.sin((t - sc.t0 - 1.4) * 4)) * 0.04 : 1; cta.style.opacity = q; cta.style.transform = `translateY(${(1 - q) * 30}px) scale(${pulse})`; });
    anims.push((t) => { document.getElementById("mark").style.opacity = t >= sc.t0 ? 0 : 0.5; });
  },
};

for (const sc of S.scenes) { const node = el("scene"); builders[sc.type](sc, node); sceneFade(sc, node); }
window.render = (t) => anims.forEach((f) => f(t));
window.DURATION = S.duration;
render(0);
</script>
</body>
</html>
